<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>局内追赶与超越验收</title><style>body{margin:16px;background:#edf5fb;color:#573529;font:15px Arial}main{display:flex;gap:18px}#game-container{width:360px;height:640px;flex:none}aside{width:400px}button{padding:10px;margin:3px;border:1px solid #977154;border-radius:8px;cursor:pointer}pre{background:#fff;padding:10px;white-space:pre-wrap;line-height:1.5}h1{font-size:21px}</style></head><body><main><div id="game-container"></div><aside><h1>局内追赶与超越验收</h1><p>独立QA账号，不修改正常金币和周榜。</p><button id="start">查看开局目标</button><button id="near">查看199米追赶</button><button id="pop">真实超越并暂停预览</button><button id="leading">查看已经第一名</button><button id="status">读取状态</button><button id="tests">运行追赶场景回归</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';import {getWeeklyLeaderboard} from '/src/game/leaderboardContext.ts';import {WeeklyLeaderboard,WEEKLY_LEADERBOARD_KEY} from '/src/game/weeklyLeaderboard.ts';const game=StartGame('game-container'),PREFIX='qa-rank-chase-'+Date.now();let sequence=0,key='';const out=document.getElementById('result'),delay=ms=>new Promise(r=>setTimeout(r,ms)),report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2),check=(v,m)=>{if(!v)throw new Error(m)};game.registry.set('coinStorageKey',PREFIX);
async function until(p,ms=6000){const end=performance.now()+ms;while(performance.now()<end){if(p())return;await new Promise(requestAnimationFrame)}throw new Error('等待状态超时')}
const g=()=>game.scene.getScene('Game'),menu=()=>game.scene.getScene('MainMenu');
function hold(s){if(s.mover){s.placeBlock(s.mover,s.anchorX+1200,s.stackBottom(s.support));s.mover.vx=0}}
async function round(best=0,meters=0,model=null){await until(()=>menu().buttons.length===5,12000);for(const id of ['MainMenu','Game','GameOver','ReturnConfirmation','WeeklyRanking'])game.scene.stop(id);key=PREFIX+'-'+(++sequence);game.registry.set('coinStorageKey',key);game.registry.remove('weeklyLeaderboardContext');if(model)game.registry.set('weeklyLeaderboardContext',{key:WEEKLY_LEADERBOARD_KEY+':qa:'+key,service:model});getWeeklyLeaderboard(menu()).record(best);game.scene.start('Game');await delay(100);await until(()=>game.scene.isActive('Game')&&g().chaseHud);const s=g();s.forceItem('normal');hold(s);s.heightMeters=meters;s.updateHeight();s.hint.setVisible(meters===0);return s}
function land(s,kind='normal'){s.forceItem(kind);const before=s.stack.length,b=s.mover;s.grounded=false;s.player.vy=-2*s.risePx;s.player.node.y-=2;s.hint.setVisible(false);let delivered=false;for(let i=0;i<160;i++){if(!delivered&&s.bottom(s.player.node)<s.top(s.body(b))-2){s.placeBlock(b,s.anchorX,s.stackBottom(s.support));b.vx=0;delivered=true}s.simulate(.008);if(s.stack.length>before||s.phase!=='play')break}s.syncPlayerSprite();check(s.stack.length===before+1,'应真实成功落地');if(!s.springFlight)hold(s)}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
function uiClick(s,x,y){s.cameras.main.preRender();const p=s.input.activePointer;p.x=x;p.y=y;p.button=0;p.updateWorldPoint(s.cameras.main);s.onPointerDown(p)}
function status(){const s=g();return{meters:s.meters(),chase:s.chaseHud.status(),art:s.heightText.status(),corners:s.hud.status(),paused:game.scene.isPaused('Game')}}
document.getElementById('start').onclick=async()=>{await round();report(status())};document.getElementById('near').onclick=async()=>{await round(0,199);report(status())};document.getElementById('leading').onclick=async()=>{await round(1001,0);report(status())};document.getElementById('pop').onclick=async()=>{const s=await round(0,199);land(s);await delay(740);game.scene.pause('Game');report(status())};document.getElementById('status').onclick=()=>report(status());window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('tests').onclick=async()=>{const results=[],test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
await test('开局仅无框头像和距离文案，201米使用原黄色艺术字，真实米数更新同步',async()=>{const s=await round();let u=s.chaseHud.status();check(u.target.id==='bot-4'&&u.target.name==='小夏'&&u.target.meters===200&&u.avatar===4,'目标身份');check(u.framed===false&&u.identity===''&&u.remaining===201&&u.message==='距离超越小夏还剩 201 米'&&u.digits.frames.join(',')==='letter-yellow-2,letter-yellow-0,letter-yellow-1'&&u.digits.height===48,'头像与文案');s.heightMeters=199;s.updateHeight();u=s.chaseHud.status();check(u.remaining===2&&u.history.length===0,'199米仍未超越')});
await test('200米同分不庆祝，真实落地199→201庆祝小夏并立即切400米小李',async()=>{let s=await round(0,200);check(s.chaseHud.status().remaining===1&&s.chaseHud.status().history.length===0,'同分需1米');s=await round(0,199);land(s);const u=s.chaseHud.status();check(s.meters()===201&&u.activeMessage==='成功超越小夏'&&u.target.id==='bot-3'&&u.remaining===200,'真实超越新目标');check(getWeeklyLeaderboard(s).snapshot().selfRank===5,'和真实周榜一致')});
await test('超越特效自动结束，同一目标后续低分或重复更新不重复播放',async()=>{const s=await round(0,199);land(s);await until(()=>!s.chaseHud.status().celebration.active,6000);s.updateHeight();s.chaseHud.setMeters(200);const u=s.chaseHud.status();check(u.activeMessage===null&&u.effects===0&&u.history.length===1,'自动清理与去重')});
await test('195米弹簧十盒落地205米只加10米，同时庆祝200米目标',async()=>{const s=await round(0,195);land(s,'spring');check(s.springFlight,'必须启动真实弹簧飞行');for(let i=0;i<800&&s.springFlight;i++)s.simulate(.008);hold(s);const u=s.chaseHud.status();check(s.meters()===205&&u.history.length===1&&u.history[0]==='成功超越小夏'&&u.target.meters===400&&u.remaining===196,'固定10米与超越同步')});
await test('一次跳分越过多个目标按200至1000米依次跳字，最终进入第一名提示',async()=>{const s=await round();s.heightMeters=1001;s.updateHeight();let u=s.chaseHud.status();check(u.leading&&!u.target&&u.identity==='你已经是第一名了'&&u.message==='继续刷新记录吧','登顶文案');check(u.history.concat(u.queue.map(n=>'成功超越'+n)).join('|')==='成功超越小夏|成功超越小李|成功超越小刚|成功超越小红|成功超越小明','五目标无遗漏');await until(()=>s.chaseHud.status().history.length===5&&!s.chaseHud.status().celebration.active,25000);u=s.chaseHud.status();check(u.history.length===5&&u.activeMessage===null&&u.effects===0,'全部队列依次结束')});
await test('本周最佳210的新局追赶400米，剩余按本局为401米，无旧目标回放',async()=>{const s=await round(210,0),u=s.chaseHud.status();check(u.target.meters===400&&u.remaining===401&&u.history.length===0,'排名下一名与本局距离');land(s);check(s.chaseHud.status().remaining===399&&s.chaseHud.status().history.length===0,'真实低分落地减少差距不重复庆祝')});
await test('本周已第一名的新局仍显示登顶，1200米之后继续跳且竖条不再推进',async()=>{const s=await round(1001,0);check(s.chaseHud.status().leading&&s.chaseHud.status().history.length===0,'第一名新局');s.heightMeters=1200;s.updateHeight();land(s);check(s.meters()===1202&&s.chaseHud.status().leading&&s.hud.status().ratio===1,'继续跳、真实米数和进度封顶')});
await test('退出确认冻结逐字和星光，继续后动效原状态完成且目标不变',async()=>{const s=await round(0,199);land(s);await delay(210);s.openReturnConfirmation();await until(()=>game.scene.isPaused('Game')&&game.scene.isActive('ReturnConfirmation'));const before=s.chaseHud.status();await delay(450);const after=s.chaseHud.status();check(before.toastAlpha===after.toastAlpha&&before.toastY===after.toastY&&before.effects===after.effects&&after.remaining===200,'动效完全冻结');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>game.scene.isActive('Game'));await until(()=>!s.chaseHud.status().celebration.active,6000);check(s.chaseHud.status().history.length===1&&s.chaseHud.status().activeMessage===null,'恢复并完成一次')});
await test('退出和重开清理旧跳字，但周最佳201和下一个追赶目标保留',async()=>{const s=await round(0,199);land(s);const old=s.chaseHud;s.showOver();await until(()=>game.scene.isActive('GameOver'));check(old.status().effects===0,'旧特效清理');game.scene.start('Game');await until(()=>game.scene.isActive('Game')&&g().chaseHud!==old);hold(g());const u=g().chaseHud.status();check(u.target.meters===400&&u.remaining===401&&u.history.length===0&&getWeeklyLeaderboard(g()).snapshot().selfBest===201,'新局周最佳和新目标')});
await test('别的实例更新周榜不误庆祝，周一自动从登顶重置到200米目标',async()=>{let s=await round();new WeeklyLeaderboard(WEEKLY_LEADERBOARD_KEY+':qa:'+key).record(410);await delay(1120);check(s.chaseHud.status().target.meters===600&&s.chaseHud.status().remaining===601&&s.chaseHud.status().history.length===0,'外部更新静默');let clock=new Date(2026,10,15,23,59,59);const data=new Map(),model=new WeeklyLeaderboard(PREFIX+'clock',()=>new Date(clock),{getItem:k=>data.get(k)||null,setItem:(k,v)=>data.set(k,v)});model.record(1001);s=await round(0,0,model);check(s.chaseHud.status().leading,'换周之前第一');clock=new Date(2026,10,16,0,0,0);await delay(1120);check(s.chaseHud.status().target.meters===200&&s.chaseHud.status().remaining===201&&s.chaseHud.status().history.length===0,'新周目标无回放')});
await test('无框追赶与跳字点击不穿透，镜头滚动时位置仍固定于屏幕',async()=>{const s=await round(0,199);let b=s.chaseHud.status().bounds;uiClick(s,b.centerX,b.centerY);check(s.grounded,'无框追赶点击不可起跳');land(s);b=s.chaseHud.status().toastBounds;uiClick(s,b.centerX,b.centerY);check(s.grounded,'跳字点击不可起跳');const before=s.chaseHud.status().bounds;s.cameras.main.scrollY-=500;s.cameras.main.scrollX+=120;s.cameras.main.preRender();const after=s.chaseHud.status().bounds;check(before.x===after.x&&before.y===after.y,'屏幕固定');b=s.chaseHud.status().bounds;uiClick(s,b.centerX,b.centerY);check(s.grounded,'镜头移动后仍防穿透')});
await test('320像素竖屏及横屏无框追赶、金币、菜单、艺术字互不重叠且完整',async()=>{const s=await round();const box=document.getElementById('game-container');for(const [w,h]of [[320,480],[700,380],[360,640]]){box.style.width=w+'px';box.style.height=h+'px';game.scale.refresh();await delay(160);const b=s.chaseHud.status().bounds,art=s.heightText.status(),hud=s.hud.status();check(b.left>=0&&b.right<=s.scale.width&&b.top>=hud.cornerBottom&&b.bottom<=art.y-art.height/2,'卡片和现有UI间距');check(art.y<s.scale.height*.5&&hud.coinBounds.left===16&&hud.menuBounds.right<s.scale.width,'艺术字偏上与角落位置保留')}});
await test('艺术字距离支持0到超长数字，不额外显示ID和目标总米数',async()=>{const s=await round();const model=s.chaseHud.leaderboard,original=model.snapshot.bind(model);model.snapshot=()=>({...original(),selfBest:0,topFive:[{id:'long-id',name:'测试骑手',meters:123456789012,avatar:2,isSelf:false,rank:1}]});s.chaseHud.setMeters(0,false);const u=s.chaseHud.status();check(u.identity===''&&!u.message.includes('ID')&&u.digits.visible&&u.digits.width<=156&&u.digits.frames.length===12,'超长艺术数字缩放不溢出');const main=s.heightText.status();check(main.height===96&&main.frames[0]==='letter-yellow-0','原主米数不变')});
await test('强化庆祝有双侧至少48彩纸、两次星爆和大字动画，结束或重开完全清理',async()=>{const s=await round(0,199);land(s);await until(()=>s.chaseHud.status().celebration.burstCount>=2);let u=s.chaseHud.status();check(u.celebration.active&&u.celebration.confettiCount>=48&&u.celebration.burstCount>=2&&u.celebration.effects<=130,'礼花和星爆显著强化且有数量上限');const old=s.chaseHud;s.showOver();await until(()=>game.scene.isActive('GameOver'));check(old.status().effects===0&&!old.status().celebration.active,'退出清理粒子与动画')});
await test('礼花播放不暂停游戏，庆祝大字之外的装饰区域仍能点击起跳',async()=>{const s=await round(0,199);land(s);await delay(200);const u=s.chaseHud.status(),b=u.celebration.bounds;uiClick(s,b.centerX,b.bottom-18);check(!s.grounded&&game.scene.isActive('Game')&&s.chaseHud.status().celebration.active,'装饰区域可继续起跳，不阻断玩法')});
report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.scene.isActive('MainMenu'),12000);report('就绪：可查看追赶、超越或第一名');
</script></body></html>
