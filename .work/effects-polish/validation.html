<!doctype html><html><head><base href="/"><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Effects polish QA</title></head><body><div id="app"><div id="game-container"></div></div><script type="module">
import StartGame from '/src/game/main.ts';import {ItemEffects} from '/src/game/itemEffects.ts';import {Checkpoints} from '/src/game/checkpoints.ts';import {ItemEffects as BeforeItems} from '/.work/effects-polish/backups/itemEffects.ts';import {Checkpoints as BeforeChecks} from '/.work/effects-polish/before-checkpoints.ts';
window.__game=StartGame('game-container');window.__game.registry.set('coinStorageKey','qa-polish-coins');window.__game.registry.set('skinStorageKey','qa-polish-skins');window.__game.registry.set('leaderboardStorageKey','qa-polish-rank');
window.__setup=()=>{const g=window.__game.scene.getScene('Game');g.simulate=()=>{};g.followCamera=()=>{};g.mover.node.x=-10000;g.mover.vx=0;g.mover.moving=false;g.hint.setVisible(false);g.heightMeters=120;g.updateHeight();g.cameras.main.setScroll(g.anchorX-g.scale.width/2,g.player.node.y-g.scale.height*.64);g.altitudeBackground.update(120,50);for(let i=0;i<400;i++)g.altitudeBackground.update(120,50);};
window.__effect=(name,before=false,space=false)=>{const g=window.__game.scene.getScene('Game');g.itemEffects.destroy();g.checkpoints.destroy();g.shieldCharge.reset();g.springFlight=null;const Items=before?BeforeItems:ItemEffects,Checks=before?BeforeChecks:Checkpoints;g.itemEffects=new Items(g,1006,g.player.node.displayWidth,g.player.node.displayHeight,2008);if(before){g.itemEffects.springTrail=()=>{};g.itemEffects.speedGranted=(x,y)=>g.itemEffects.toast(x,y,'后续 5 盒加速 +30%','#ffc0b8');}g.checkpoints=new Checks(g,1010);g.altitudeBackground.progress.reset();for(let i=0;i<400;i++)g.altitudeBackground.update(space?500:120,50);const x=g.player.node.x,y=g.player.node.y,feet=g.bottom(g.player.node);if(name==='coins')g.itemEffects.coins(x,feet-g.player.node.displayHeight,96,true,()=>g.coinHud.iconCenter(),()=>g.coinHud.pulse());if(name==='shield'){g.shieldCharge.grant();g.itemEffects.shieldGranted(x,y);}if(name==='break')g.itemEffects.shieldBroken(x,y);if(name==='spring'){g.itemEffects.spring(x,feet-g.player.node.displayHeight);if(!before){for(let i=0;i<10;i++)g.itemEffects.springTrail(x,feet+130-i*13,true);}}if(name==='speed'){g.itemEffects.speedGranted(x,feet-g.player.node.displayHeight);g.itemEffects.moverSpeed({x:x+150,y:feet+30,width:153.6,height:85.76,vx:-517,depth:2},.22);}if(name==='checkpoint'){g.checkpoints.prepare(0,x,feet,g.player.node.displayHeight,130,88);g.checkpoints.gate.root.setPosition(x,y-62);g.checkpoints.gate.targetY=y-62;g.checkpoints.layout();const ok=g.checkpoints.observePlayer(x,y-25,g.player.node.displayWidth,g.player.node.displayHeight);if(!ok)throw Error('Checkpoint touch did not register');}return {name,before,meters:g.meters(),wallet:g.wallet.total};};
</script></body></html>
