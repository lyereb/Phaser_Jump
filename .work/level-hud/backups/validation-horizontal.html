<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>1000米顶栏验收</title><style>body{margin:16px;background:#f4edf2;color:#673642;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:460px}button{padding:10px;margin:4px;border:1px solid #b27b95;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>1000米统一顶部HUD</h1><p>独立QA金币键，不影响正常游戏金币。</p><button id="zero">查看开局顶栏</button><button id="half">查看500米进度</button><button id="near">查看999米进度</button><button id="full">查看1000米达成</button><button id="large">查看大金币排版</button><button id="status">读取当前场景状态</button><button id="tests">运行HUD场景回归</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-level-hud');const out=document.getElementById('result'),delay=ms=>new Promise(r=>setTimeout(r,ms));const report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2),check=(c,m)=>{if(!c)throw new Error(m)};async function until(p,timeout=4500){const end=performance.now()+timeout;while(performance.now()<end){if(p())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景超时')}
function hold(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
async function reset(kind='normal',meters=0){game.scene.stop('MainMenu');game.scene.stop('GameOver');game.scene.stop('ReturnConfirmation');const g=game.scene.getScene('Game');g.scene.restart();await delay(90);await until(()=>g.scene.isActive()&&!g.settlementShown);g.forceItem(kind);hold(g);g.heightMeters=meters;g.updateHeight();await delay(420);return g}
function land(g){const old=g.stack.length,b=g.mover;g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;let delivered=false;for(let i=0;i<150;i++){if(!delivered&&g.bottom(g.player.node)<g.top(g.body(b))-2){g.placeBlock(b,g.anchorX,g.stackBottom(g.support));b.vx=0;delivered=true}g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break}g.syncPlayerSprite();check(g.stack.length===old+1,'落地必须成功');hold(g)}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
function status(){const g=game.scene.getScene('Game');return {active:g.scene.isActive(),paused:g.scene.isPaused(),grounded:g.grounded,phase:g.phase,coins:g.wallet?.total,hud:g.hud?.status(),returnConfirmation:game.scene.isActive('ReturnConfirmation'),menu:game.scene.isActive('MainMenu')}}
for(const [id,meters]of [['zero',0],['half',500],['near',999],['full',1000]])document.getElementById(id).onclick=async()=>{const g=await reset('normal',meters);g.coinHud.setValue(g.wallet.total);report(status())};
document.getElementById('large').onclick=async()=>{const g=await reset('normal',950);g.coinHud.setValue(Number.MAX_SAFE_INTEGER);report(status())};document.getElementById('status').onclick=()=>report(status());
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('tests').onclick=async()=>{const results=[],test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
 await test('开局统一顶栏显示0米、终点1000米和剩余1000米',async()=>{const g=await reset(),s=g.hud.status();check(s.goal===1000&&s.meters===0&&s.remaining===1000&&s.displayedRatio===0,'零进度正确');check(s.goalText==='终点 1000 米'&&s.currentText==='已走 0 米','准确文案');check(g.coinHud.root.parentContainer===g.hud.root,'金币必须嵌入同一顶栏，不是独立框')});
 await test('500/999/1000/超出终点准确显示，满条不会改真实计分或自动退出',async()=>{const g=await reset();for(const meters of [500,999,1000,1005]){g.heightMeters=meters;g.updateHeight();await delay(430);const s=g.hud.status();check(s.meters===meters&&s.remaining===Math.max(0,1000-meters),'数字同步');check(Math.abs(s.displayedRatio-Math.min(1,meters/1000))<1e-8,'平滑进度终值');check(s.percent===(meters===999?99.9:meters>=1000?100:50),'百分比正确');check(s.markerX>=s.trackLeft&&s.markerX<=s.trackRight+.01,'标记不能越界');check(g.scene.isActive()&&g.phase==='play','不添加未经定义的自动切关')}});
 await test('普通完美落地和弹簧固定10米自动更新同一进度条',async()=>{let g=await reset();land(g);await delay(430);check(g.hud.status().meters===2&&g.hud.status().percent===.2,'普通真实计分同步');g=await reset('spring',37);land(g);await until(()=>!g.springFlight);hold(g);await delay(430);check(g.meters()===47&&g.hud.status().meters===47&&g.hud.status().remaining===953,'弹簧37→47，不回到50米错误')});
 await test('金币获得实时显示、无独立背景框，重开仍保留余额',async()=>{const g=await reset('coin');const before=g.wallet.total;land(g);await delay(180);check(g.wallet.total>before&&g.coinHud.label.text===String(g.wallet.total),'金币更新同步');check(g.coinHud.root.list.filter(o=>o.type==='Graphics').length===0,'金币无独立背景绘图');const bank=g.wallet.total;await reset();check(g.wallet.total===bank&&g.hud.status().meters===0,'重开金币保留进度清零')});
 await test('点击整块HUD会命中ui并拦截跳跃，真正游戏区域仍可起跳',async()=>{const g=await reset(),s=g.hud.status(),p=game.input.activePointer,old=p.position.clone(),button=p.button;p.button=0;for(const [x,y]of [[s.bounds.centerX,s.bounds.centerY],[s.coinBounds.centerX,s.coinBounds.centerY],[s.trackLeft+80,s.bounds.bottom-25]]){p.position.set(x,y);check(g.input.hitTestPointer(p).some(o=>o.getData('ui')===true),'顶栏必须是真实ui命中区');g.onPointerDown(p);check(g.grounded,'HUD不得穿透起跳')}p.position.set(g.scale.width/2,g.scale.height*.65);g.onPointerDown(p);check(!g.grounded,'画面游戏区仍可以跳跃');p.position.copy(old);p.button=button});
 await test('顶部菜单仍先确认，取消后保留进度与金币并且不穿透起跳',async()=>{const g=await reset('normal',500),bank=g.wallet.total;g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive('ReturnConfirmation'));check(g.scene.isPaused(),'应暂停');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>g.scene.isActive());check(g.grounded&&g.wallet.total===bank&&g.hud.status().meters===500,'继续不重置、不跳跃')});
 await test('进度平滑推进和小骑手动画在暂停窗口期间均冻结',async()=>{const g=await reset();g.heightMeters=500;g.updateHeight();await delay(90);g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive('ReturnConfirmation'));const before=JSON.stringify([g.hud.visual.ratio,g.hud.bob.y,g.hud.bob.angle]);await delay(280);check(JSON.stringify([g.hud.visual.ratio,g.hud.bob.y,g.hud.bob.angle])===before,'暂停应冻结全部HUD动画');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>g.scene.isActive());await delay(430);check(Math.abs(g.hud.status().displayedRatio-.5)<1e-8,'恢复同一条进度动画')});
 await test('镜头移动后顶栏屏幕位置与命中区仍固定',async()=>{const g=await reset(),before=JSON.stringify(g.hud.status().bounds);g.cameras.main.scrollX=200;g.cameras.main.scrollY=-1500;check(JSON.stringify(g.hud.status().bounds)===before,'布局不跟随世界镜头');const p=game.input.activePointer,old=p.position.clone();p.position.set(g.hud.bounds().centerX,g.hud.bounds().centerY);check(g.input.hitTestPointer(p).some(o=>o.getData('ui')===true),'镜头移动后仍正确命中');p.position.copy(old)});
 await test('竖屏横屏顶栏完整、金币菜单均在卡片内，提示和调试不重叠',async()=>{const g=await reset(),box=document.getElementById('game-container');for(const size of [[320,480],[700,380],[360,640]]){box.style.width=size[0]+'px';box.style.height=size[1]+'px';game.scale.refresh();await delay(120);const s=g.hud.status();check(s.bounds.left>=0&&s.bounds.right<=g.scale.width&&s.bounds.top>=0&&s.bounds.bottom<=g.scale.height,'卡片完整');for(const r of [s.menuBounds,s.coinBounds])check(r.left>=s.bounds.left&&r.right<=s.bounds.right&&r.top>=s.bounds.top&&r.bottom<=s.bounds.bottom,'所有区域统一在卡片内');check(g.hint.getBounds().top>s.bounds.bottom&&g.debugPanel.buttonBg.getBounds().top>s.bounds.bottom,'提示调试不能重叠顶栏')}});
 await test('失败结算显示真实米数，再挑战重置HUD并保留金币',async()=>{const g=await reset('normal',500),bank=g.wallet.total;g.fly(0);g.player.node.y=g.cameras.main.scrollY+g.scale.height+220;await until(()=>game.scene.isActive('GameOver'));const r=game.scene.getScene('GameOver');check(r.status().meters===500,'结算正确');press(r.retryButton);await until(()=>g.scene.isActive());hold(g);check(g.hud.status().meters===0&&g.hud.status().goal===1000&&g.wallet.total===bank,'新局重置进度并保留金币')});
 report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.textures.exists('checkpoint-bag'),8000);if(out.textContent==='资源加载中')report('就绪：可查看顶栏或运行回归');
</script></body></html>
