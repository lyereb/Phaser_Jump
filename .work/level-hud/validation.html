<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>1000米竖向进度验收</title><style>body{margin:16px;background:#f4edf2;color:#673642;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:460px}button{padding:10px;margin:4px;border:1px solid #b27b95;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>1000米左侧竖向进度</h1><p>独立QA金币键，不影响正常游戏金币。</p><button id="zero">查看开局布局</button><button id="half">查看500米进度</button><button id="near">查看999米进度</button><button id="full">查看1000米终点</button><button id="beyond">查看1200米继续挑战</button><button id="status">读取当前场景状态</button><button id="tests">运行竖条场景回归</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-level-hud');const out=document.getElementById('result'),delay=ms=>new Promise(r=>setTimeout(r,ms));const report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2),check=(c,m)=>{if(!c)throw new Error(m)};async function until(p,timeout=5000){const end=performance.now()+timeout;while(performance.now()<end){if(p())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景超时')}
function hold(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
async function reset(kind='normal',meters=0){game.scene.stop('MainMenu');game.scene.stop('GameOver');game.scene.stop('ReturnConfirmation');const g=game.scene.getScene('Game');g.scene.restart();await delay(90);await until(()=>g.scene.isActive()&&!g.settlementShown);g.forceItem(kind);hold(g);g.heightMeters=meters;g.updateHeight();await delay(420);return g}
function land(g){const old=g.stack.length,b=g.mover;g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;let delivered=false;for(let i=0;i<150;i++){if(!delivered&&g.bottom(g.player.node)<g.top(g.body(b))-2){g.placeBlock(b,g.anchorX,g.stackBottom(g.support));b.vx=0;delivered=true}g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break}g.syncPlayerSprite();check(g.stack.length===old+1,'落地必须成功');hold(g)}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
const artValue=g=>g.heightText.status().frames.map(frame=>String(frame).split('-').pop()).join('');
function status(){const g=game.scene.getScene('Game');return {active:g.scene.isActive(),paused:g.scene.isPaused(),grounded:g.grounded,phase:g.phase,coins:g.wallet?.total,artMeters:g.heightText?.status(),hud:g.hud?.status(),returnConfirmation:game.scene.isActive('ReturnConfirmation'),menu:game.scene.isActive('MainMenu')}}
for(const [id,meters]of [['zero',0],['half',500],['near',999],['full',1000],['beyond',1200]])document.getElementById(id).onclick=async()=>{await reset('normal',meters);report(status())};document.getElementById('status').onclick=()=>report(status());
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('tests').onclick=async()=>{const results=[],test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
 await test('金币左上菜单右上，竖条只显示250/500/750与终点1000米',async()=>{const g=await reset(),s=g.hud.status();check(s.orientation==='vertical'&&s.meters===0&&s.goal===1000&&s.displayedRatio===0,'竖向零进度');check(JSON.stringify(s.labels)===JSON.stringify(['250','500','750','终点\n1000米']),'只保留四组标记');check(g.hud.root.list.filter(o=>o.type==='Text').length===4,'不显示标题、剩余或百分比');check(s.coinBounds.left===16&&s.menuBounds.right<=g.scale.width-15,'左右角落');check(g.coinHud.root.parentContainer===null,'金币不再放横向卡片中');check(artValue(g)==='0','黄色艺术字恢复')});
 await test('250/500/750/999/1000竖条由下向上准确推进，艺术字显示真实米数',async()=>{const g=await reset();for(const meters of [250,500,750,999,1000]){g.heightMeters=meters;g.updateHeight();await delay(430);const s=g.hud.status();check(s.meters===meters&&Math.abs(s.displayedRatio-meters/1000)<1e-8,'比例精确');check(Math.abs(s.markerY-(s.trackBottom-(s.trackBottom-s.trackTop)*meters/1000))<1e-7,'标记自底向上');check(artValue(g)===String(meters),'必须使用原艺术数字')}});
 await test('达到1000米后还可真实跳跃落地，米数增加而竖条和标记不再移动',async()=>{const g=await reset('normal',1000),before=g.hud.status().markerY;land(g);await delay(430);check(g.meters()===1002&&artValue(g)==='1002','继续跳跃正常加分并更新艺术字');check(g.hud.status().markerY===before&&g.hud.status().displayedRatio===1,'进度停止在终点');g.heightMeters=1200;g.updateHeight();await delay(80);check(g.hud.status().markerY===before&&artValue(g)==='1200'&&g.phase==='play','不结束不切关且1200米继续展示')});
 await test('普通完美落地与弹簧固定10米同步竖条和艺术字',async()=>{let g=await reset();land(g);await delay(430);check(artValue(g)==='2'&&g.hud.status().meters===2,'普通真实计分同步');g=await reset('spring',37);land(g);await until(()=>!g.springFlight);hold(g);await delay(430);check(g.meters()===47&&artValue(g)==='47'&&g.hud.status().meters===47,'弹簧37→47保持正确')});
 await test('金币即时更新、无独立背景框，重开清零进度且保留余额',async()=>{const g=await reset('coin'),before=g.wallet.total;land(g);await delay(180);check(g.wallet.total>before&&g.coinHud.label.text===String(g.wallet.total),'金币同步');check(g.coinHud.root.list.filter(o=>o.type==='Graphics'||o.type==='Rectangle').length===0,'金币没有独立框');const bank=g.wallet.total;await reset();check(g.wallet.total===bank&&artValue(g)==='0'&&g.hud.status().displayedRatio===0,'重开正常')});
 await test('点击金币或左侧竖条命中ui不穿透，游戏空白区域仍能起跳',async()=>{const g=await reset(),s=g.hud.status(),p=game.input.activePointer,old=p.position.clone(),button=p.button;p.button=0;for(const [x,y]of [[s.bounds.centerX,s.bounds.centerY],[s.coinBounds.centerX,s.coinBounds.centerY],[s.bounds.centerX,s.trackTop+80],[s.bounds.right-8,s.trackTop-40]]){p.position.set(x,y);check(g.input.hitTestPointer(p).some(o=>o.getData('ui')===true),'UI必须真实命中');g.onPointerDown(p);check(g.grounded,'不得穿透起跳')}p.position.set(g.scale.width*.65,g.scale.height*.65);g.onPointerDown(p);check(!g.grounded,'游戏区域仍能起跳');p.position.copy(old);p.button=button});
 await test('菜单仍打开暂停确认，竖条与小骑手动作冻结，继续不重置或误跳',async()=>{const g=await reset();g.heightMeters=500;g.updateHeight();await delay(90);g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive('ReturnConfirmation'));check(g.scene.isPaused(),'暂停');const before=JSON.stringify([g.hud.visual.ratio,g.hud.bob.angle]);await delay(280);check(JSON.stringify([g.hud.visual.ratio,g.hud.bob.angle])===before,'UI动画冻结');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>g.scene.isActive());await delay(430);check(g.grounded&&artValue(g)==='500'&&Math.abs(g.hud.status().displayedRatio-.5)<1e-8,'恢复原状态不误跳')});
 await test('镜头移动后进度与角落位置保持固定，点击命中正常',async()=>{const g=await reset(),before=JSON.stringify([g.hud.status().bounds,g.heightText.status().x,g.heightText.status().y]);g.cameras.main.scrollX=200;g.cameras.main.scrollY=-1500;g.cameras.main.preRender();check(JSON.stringify([g.hud.status().bounds,g.heightText.status().x,g.heightText.status().y])===before,'屏幕固定');const p=game.input.activePointer,old=p.position.clone();p.position.set(g.hud.bounds().centerX,g.hud.bounds().centerY);check(g.input.hitTestPointer(p).some(o=>o.getData('ui')===true),'镜头变化仍命中');p.position.copy(old)});
 await test('竖屏横屏布局完整，艺术字位于偏上且不遮左侧刻度，提示和调试避让',async()=>{const g=await reset('normal',1000),box=document.getElementById('game-container');for(const size of [[320,480],[700,380],[360,640]]){box.style.width=size[0]+'px';box.style.height=size[1]+'px';game.scale.refresh();await delay(120);const s=g.hud.status(),a=g.heightText.status();for(const r of [s.bounds,s.menuBounds,s.coinBounds])check(r.left>=0&&r.right<=g.scale.width&&r.top>=0&&r.bottom<=g.scale.height,'全部区域在屏幕内');check(a.y<g.scale.height*.45&&a.x-a.width/2>s.bounds.right,'艺术字偏上且横向避开竖条');check(g.hint.getBounds().top>s.cornerBottom&&g.debugPanel.buttonBg.getBounds().top>s.menuBounds.bottom,'角落控件不重叠提示与调试')}});
 await test('1000米以上失败仍按真实米数结算，重新挑战还原艺术字和竖条',async()=>{const g=await reset('normal',1200),bank=g.wallet.total;g.fly(0);g.player.node.y=g.cameras.main.scrollY+g.scale.height+220;await until(()=>game.scene.isActive('GameOver'));const r=game.scene.getScene('GameOver');check(r.summary.meters===1200,'失败结算不截断在1000米');press(r.retryButton);await until(()=>g.scene.isActive());hold(g);check(artValue(g)==='0'&&g.hud.status().displayedRatio===0&&g.wallet.total===bank,'重试归零金币保留')});
 report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.textures.exists('checkpoint-bag'),8000);if(out.textContent==='资源加载中')report('就绪：可查看竖条或运行回归');
</script></body></html>
