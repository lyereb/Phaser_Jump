<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>本地周榜验收</title><style>body{margin:16px;background:#edf5fb;color:#493326;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:440px}button{padding:10px;margin:4px;border:1px solid #896145;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:12px;line-height:1.5}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>本地周排行榜验收</h1><p>独立QA账号，不修改你的正常金币或周榜。</p><button id="menu">查看主菜单</button><button id="empty">查看初始五个bot</button><button id="fifth">查看210米第5名</button><button id="first">查看1001米第1名</button><button id="status">读取当前状态</button><button id="tests">运行周榜场景回归</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';import {getWeeklyLeaderboard} from '/src/game/leaderboardContext.ts';import {WeeklyLeaderboard,WEEKLY_LEADERBOARD_KEY} from '/src/game/weeklyLeaderboard.ts';const game=StartGame('game-container'),PREFIX='qa-weekly-'+Date.now();let sequence=0,key='';const out=document.getElementById('result'),delay=ms=>new Promise(r=>setTimeout(r,ms)),report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2),check=(v,m)=>{if(!v)throw new Error(m)};
game.registry.set('coinStorageKey',PREFIX);async function until(p,ms=5000){const end=performance.now()+ms;while(performance.now()<end){if(p())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景超时')}
const g=()=>game.scene.getScene('Game'),menuScene=()=>game.scene.getScene('MainMenu'),rank=()=>game.scene.getScene('WeeklyRanking');
function newProfile(){key=PREFIX+'-'+(++sequence);game.registry.set('coinStorageKey',key);game.registry.remove('weeklyLeaderboardContext')}
async function menu(best=0,reuse=false){await until(()=>menuScene().buttons.length===5,10000);for(const name of ['MainMenu','Game','GameOver','ReturnConfirmation','WeeklyRanking'])game.scene.stop(name);if(!reuse)newProfile();game.scene.start('MainMenu');await delay(100);await until(()=>game.scene.isActive('MainMenu'));getWeeklyLeaderboard(menuScene()).record(best);return menuScene()}
async function open(){const m=menuScene(),button=m.buttons.find(b=>b.id==='rank');m.onButton('rank',button.image);await until(()=>game.scene.isActive('WeeklyRanking')&&game.scene.isPaused('MainMenu'));await delay(50);return rank()}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
async function close(method='back'){const r=rank();if(method==='escape')r.input.keyboard.emit('keydown-ESC');else press(method==='x'?r.closeButton:r.backButton);await until(()=>game.scene.isActive('MainMenu')&&!game.scene.isActive('WeeklyRanking'))}
function hold(s){if(s.mover){s.placeBlock(s.mover,s.anchorX+1200,s.stackBottom(s.support));s.mover.vx=0}}
function land(s){const before=s.stack.length,b=s.mover;s.forcedItem='normal';s.grounded=false;s.player.vy=-2*s.risePx;s.player.node.y-=2;let delivered=false;for(let i=0;i<150;i++){if(!delivered&&s.bottom(s.player.node)<s.top(s.body(b))-2){s.placeBlock(b,s.anchorX,s.stackBottom(s.support));b.vx=0;delivered=true}s.simulate(.008);if(s.stack.length>before||s.phase!=='play')break}s.syncPlayerSprite();check(s.stack.length===before+1,'应真实成功落地');hold(s)}
function status(){return{ranking:game.scene.isActive('WeeklyRanking')?rank().status():null,mainMenuPaused:game.scene.isPaused('MainMenu'),mainMenuActive:game.scene.isActive('MainMenu'),gameActive:game.scene.isActive('Game'),menuStarted:menuScene().started,rankingFlag:menuScene().rankingOpen,rankTweens:menuScene().tweens.getTweensOf(menuScene().buttons.find(b=>b.id==='rank').image).map(t=>({paused:t.paused,elapsed:t.elapsed,total:t.totalDuration})),loop:game.loop.frame}}
for(const [id,best]of [['empty',0],['fifth',210],['first',1001]])document.getElementById(id).onclick=async()=>{await menu(best);await open();report(status())};document.getElementById('menu').onclick=async()=>{await menu();report(status())};document.getElementById('status').onclick=()=>report(status());
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('tests').onclick=async()=>{const results=[],test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
await test('主菜单排行榜打开独立窗口且暂停底层，初始展示5bot头像姓名及1000到200米',async()=>{await menu();const r=await open(),s=r.status();check(s.topFive.length===5&&JSON.stringify(s.topFive.map(e=>e.meters))===JSON.stringify([1000,800,600,400,200]),'5bot分数');check(s.topFive.every(e=>e.name&&Number.isInteger(e.avatar)&&!e.isSelf),'姓名头像');check(s.mockData&&s.layout==='champion-plus-four-tiles-and-self','原创布局与模拟声明');check(game.scene.isPaused('MainMenu')&&!game.scene.isActive('Game'),'底层暂停不开始游戏')});
await test('排行榜点击后即使尺寸更新取消按钮动画也能打开，重复点击仅一个窗口',async()=>{await menu();const m=menuScene(),image=m.buttons.find(b=>b.id==='rank').image;m.onButton('rank',image);m.layout();m.onButton('rank',image);await until(()=>game.scene.isActive('WeeklyRanking'));check(game.scene.isPaused('MainMenu'),'不能被动效取消阻断');await close()});
await test('210米挤掉200米bot成为第5名，410米第4名，1001米成为冠军',async()=>{for(const [score,place]of [[210,5],[410,4],[1001,1]]){await menu(score);const r=await open(),s=r.status();check(s.selfBest===score&&s.selfRank===place&&s.topFive[place-1].isSelf,'自己插入正确位置');check(s.topFive.length===5&&!s.topFive.some(e=>e.meters===200),'只保留前5名');await close()}});
await test('200米同分bot先排，榜外显示个人成绩与还需1米提示',async()=>{await menu(200);const r=await open(),s=r.status();check(s.selfRank===6&&s.selfBest===200&&s.gapToTopFive===1&&!s.topFive.some(e=>e.isSelf),'榜外显示且同分稳定');await close()});
await test('真实落地208→210即时记录，未失败直接返回主菜单也成为第5名',async()=>{await menu();const m=menuScene();m.onButton('start',m.buttons.find(b=>b.id==='start').image);await until(()=>game.scene.isActive('Game'));const s=g();s.forceItem('normal');hold(s);s.heightMeters=208;s.updateHeight();land(s);check(s.meters()===210&&getWeeklyLeaderboard(s).snapshot().selfBest===210,'真实落地立即写入');s.openReturnConfirmation();await until(()=>game.scene.isActive('ReturnConfirmation'));press(game.scene.getScene('ReturnConfirmation').returnButton);await until(()=>game.scene.isActive('MainMenu'));await open();check(rank().status().selfRank===5,'退出也不丢成绩');await close()});
await test('较低新局不覆盖周最佳，重开和新实例读取保存的210米',async()=>{await menu(210);const model=getWeeklyLeaderboard(menuScene());check(!model.record(5)&&model.snapshot().selfBest===210,'低分不覆盖');const fresh=new WeeklyLeaderboard(WEEKLY_LEADERBOARD_KEY+':qa:'+key);check(fresh.snapshot().selfBest===210,'刷新持久化');const m=menuScene();m.onButton('start',m.buttons.find(b=>b.id==='start').image);await until(()=>game.scene.isActive('Game'));hold(g());check(g().meters()===0&&getWeeklyLeaderboard(g()).snapshot().selfBest===210,'重开分数零周最佳保留');await menu(0,true);await open();check(rank().status().selfBest===210,'主菜单重新打开仍保存');await close()});
await test('窗口打开时另一个实例提高最佳会自动刷新榜单，周一换周自动回到5bot',async()=>{await menu(210);await open();new WeeklyLeaderboard(WEEKLY_LEADERBOARD_KEY+':qa:'+key).record(410);await delay(1120);check(rank().status().selfBest===410&&rank().status().selfRank===4,'窗口实时刷新');await close();let clock=new Date(2026,10,15,23,59,59);const store=new Map(),model=new WeeklyLeaderboard(PREFIX+'clock',()=>new Date(clock),{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)});model.record(210);game.registry.set('weeklyLeaderboardContext',{key:WEEKLY_LEADERBOARD_KEY+':qa:'+key,service:model});await open();check(rank().status().selfRank===5,'换周前');clock=new Date(2026,10,16,0,0,0);await delay(1120);check(rank().status().selfBest===0&&rank().status().selfRank===null&&rank().status().topFive.length===5,'新周清理个人最佳');await close()});
await test('关闭按钮、右上X、Escape均恢复主菜单，可反复打开且无重复场景',async()=>{await menu(210);for(const method of ['back','x','escape']){await open();await close(method);check(!menuScene().rankingOpen&&game.scene.isActive('MainMenu'),'菜单恢复可再次点击')}});
await test('遮罩不关闭、不透点启动，直接释放和右键无效，开始挑战只执行一次',async()=>{await menu(210);const r=await open(),p={id:1,button:0},e={stopPropagation(){}};r.shade.emit('pointerdown',p,0,0,e);r.shade.emit('pointerup',p,0,0,e);r.challengeButton.emit('pointerup',p,0,0,e);r.challengeButton.emit('pointerdown',{id:1,button:2},0,0,e);r.challengeButton.emit('pointerup',{id:1,button:2},0,0,e);check(game.scene.isActive('WeeklyRanking')&&!game.scene.isActive('Game'),'背景和非法点击无效');press(r.challengeButton);await until(()=>game.scene.isActive('Game')&&!game.scene.isActive('WeeklyRanking'));hold(g());check(g().meters()===0&&g().grounded&&getWeeklyLeaderboard(g()).snapshot().selfBest===210,'新挑战正常不穿透且最佳保留')});
await test('窄竖屏与横屏窗口完整，两个操作与关闭X均在画面内',async()=>{await menu(210);await open();const box=document.getElementById('game-container');for(const [w,h]of [[320,480],[700,380],[360,640]]){box.style.width=w+'px';box.style.height=h+'px';game.scale.refresh();await delay(120);const s=rank().status();for(const b of [s.bounds,s.closeBounds,s.backBounds,s.challengeBounds])check(b.left>=0&&b.right<=rank().scale.width&&b.top>=0&&b.bottom<=rank().scale.height,'窗口和按钮完整')}});
report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.scene.isActive('MainMenu'),10000);report('就绪：可查看周榜或运行回归');
</script></body></html>
