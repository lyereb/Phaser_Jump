<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>弹簧与触碰修复验证</title><style>body{margin:16px;background:#f4edf2;color:#673642;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:460px}button{padding:10px;margin:4px;border:1px solid #b27b95;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>弹簧与checkpoint触碰修复</h1><p>独立QA金币键，不影响正常游戏金币。</p><button id="spring">从37米演示弹簧+10米</button><button id="touch">0米空中触碰50标签</button><button id="tests">运行新规则回归</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-spring-touch');const out=document.getElementById('result');const delay=ms=>new Promise(r=>setTimeout(r,ms));const report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const check=(c,m)=>{if(!c)throw new Error(m)};
async function until(p,timeout=4500){const end=performance.now()+timeout;while(performance.now()<end){if(p())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景超时')}
function hold(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
async function reset(kind='normal',meters=0,streak=0){game.scene.stop('MainMenu');game.scene.stop('GameOver');game.scene.stop('ReturnConfirmation');const g=game.scene.getScene('Game');g.scene.restart();await delay(90);await until(()=>g.scene.isActive()&&!g.settlementShown);g.forceItem(kind);hold(g);g.heightMeters=meters;g.perfectStreak=streak;g.updateHeight();g.prepareCheckpoint();await delay(90);return g}
function land(g,perfect=true){const old=g.stack.length,b=g.mover;g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;let delivered=false;for(let i=0;i<150;i++){if(!delivered&&g.bottom(g.player.node)<g.top(g.body(b))-2){g.placeBlock(b,g.anchorX+(perfect?0:31),g.stackBottom(g.support));b.vx=0;delivered=true}g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break}g.syncPlayerSprite();check(g.stack.length===old+1,'真实落地必须成功');hold(g);return b}
function poseGate(g,x,y){const gate=g.checkpoints.gate;g.tweens.killTweensOf(gate.root);g.tweens.killTweensOf(gate.bag);gate.bag.setAngle(0);gate.root.setPosition(x,y);gate.targetY=y;g.checkpoints.layout();return gate}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
function info(g){return {meters:g.meters(),grounded:g.grounded,spring:g.springFlight?.elapsed,stack:g.stack.length,perfectBoxes:g.perfectBoxes,checkpoint:g.checkpoints.status()}}
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('spring').onclick=async()=>{const g=await reset('spring',37,8);land(g);report(info(g));await until(()=>!g.springFlight);hold(g);report(info(g))};
document.getElementById('touch').onclick=async()=>{const g=await reset();poseGate(g,g.player.node.x,g.top(g.player.node)-91);g.grounded=false;g.player.vy=-220;g.simulate(.008);g.syncPlayerSprite();report(info(g))};
document.getElementById('tests').onclick=async()=>{const results=[];const test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
 await test('完美与普通弹簧、低高连击时，整次动作都恰好+10而非+12/+15/+50',async()=>{for(const streak of [0,3,10])for(const perfect of [true,false]){const g=await reset('spring',37,streak);const source=land(g,perfect);check(g.meters()===37,'弹簧触发落地不能先加额外米数');const combo=g.perfectStreak;await until(()=>!g.springFlight);hold(g);check(g.meters()===47,'整次弹簧必须37→47');check(g.stack.length===12&&g.springFlightsCompleted===1&&g.grounded,'十盒叠放和一次落顶正常');check(g.perfectBoxes===(perfect?11:10),'完美叠放统计保留');check(g.perfectStreak===combo,'自动盒不放大人物连击');g.activateItem(source,perfect);check(g.meters()===47&&!g.springFlight,'同弹簧不重复触发')}});
 await test('普通和完美跳跃原有1/2/3/4/5米规则不变',async()=>{const g=await reset();land(g);check(g.meters()===2,'首个完美2米');g.forceItem('normal');hold(g);land(g);check(g.meters()===5,'第二个完美3米');g.forceItem('normal');hold(g);land(g,false);check(g.meters()===6,'普通1米')});
 await test('0米空中碰到50福袋立即爆开，不等米数或落地',async()=>{const g=await reset();const gate=poseGate(g,g.player.node.x,g.top(g.player.node)-91);g.grounded=false;g.player.vy=-220;g.simulate(.008);const s=g.checkpoints.status();check(g.meters()===0&&!g.grounded,'分数0且仍在空中');check(s.bursts===1&&s.lastCompleted===50&&s.nextMeters===100&&s.label===100,'碰到即领50并预置100');check(g.checkpoints.gate!==gate,'旧目标必须移除')});
 await test('下降碰到福袋或身体碰到侧面的红绳也能触发',async()=>{for(const rope of [false,true]){const g=await reset();const gate=poseGate(g,g.player.node.x,g.top(g.player.node)-30);if(rope)g.player.node.x+=220;g.grounded=false;g.player.vy=100;if(rope)g.player.node.y=gate.root.y-20+g.player.node.displayHeight/2;g.simulate(.008);check(g.checkpoints.status().bursts===1,'下降或侧面红绳身体接触必须触发')}});
 await test('分数已超过50、但实际未碰到仍不触发',async()=>{const g=await reset('normal',55);poseGate(g,g.player.node.x,g.top(g.player.node)-1000);g.simulate(.008);check(g.checkpoints.status().bursts===0&&g.checkpoints.status().nextMeters===50,'不能由分数单独触发')});
 await test('未碰到的横向错位、身体完全在绳上方和隐藏目标不误触发',async()=>{for(const mode of ['side','above','hidden']){const g=await reset();const gate=poseGate(g,g.player.node.x,g.top(g.player.node)-30);if(mode==='side')g.player.node.x+=220;if(mode==='above')gate.root.y=g.bottom(g.player.node)+300;if(mode==='hidden')gate.root.setVisible(false);g.simulate(.008);check(g.checkpoints.status().bursts===0,mode+'不能触发')}});
 await test('碰到后落回旧盒或随后撞击不撤销已领取目标，同一个只爆一次',async()=>{const g=await reset();poseGate(g,g.player.node.x,g.top(g.player.node)-91);g.grounded=false;g.player.vy=-220;g.simulate(.008);const score=g.meters();for(let i=0;i<8;i++)g.checkpoints.observePlayer(g.player.node.x,g.player.node.y,g.player.node.displayWidth,g.player.node.displayHeight);check(g.checkpoints.status().bursts===1,'不能重复爆袋');g.fly(0);check(g.checkpoints.status().bursts===1&&g.meters()===score,'后来失败不影响触碰结果，也不额外加米')});
 await test('一次弹簧途中碰到50标签立即爆袋，仍固定总+10且不凭分数领取100',async()=>{const g=await reset('spring');land(g);poseGate(g,g.player.node.x,g.springFlight.launchSurface-g.player.node.displayHeight-220);await until(()=>g.checkpoints.status().bursts===1);check(g.springFlight&&g.meters()===0,'触发时弹簧未结束且仍0米');await until(()=>!g.springFlight);hold(g);check(g.meters()===10&&g.checkpoints.status().nextMeters===100&&g.checkpoints.status().bursts===1,'只拿实体50目标，总+10')});
 await test('暂停冻结弹簧触碰与爆袋，恢复同一批十盒只加一次10米',async()=>{const g=await reset('spring',37);land(g);await delay(120);g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive('ReturnConfirmation'));const f=g.springFlight,elapsed=f.elapsed,positions=JSON.stringify(f.deliveries.map(d=>[d.block.node.x,d.block.node.y]));const gate=g.checkpoints.gate;const y=gate.root.y;await delay(250);check(f.elapsed===elapsed&&JSON.stringify(f.deliveries.map(d=>[d.block.node.x,d.block.node.y]))===positions&&gate.root.y===y&&g.meters()===37,'暂停全部冻结');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>!g.springFlight);hold(g);check(g.meters()===47&&g.stack.length===12&&g.springFlightsCompleted===1,'恢复+10且不重复叠盒')});
 await test('弹簧修复后的结算米数为10，十一盒及完美统计保留；重试清零',async()=>{const g=await reset('spring');land(g);await until(()=>!g.springFlight);hold(g);g.fly(0);g.player.node.y=g.cameras.main.scrollY+g.scale.height+220;await until(()=>game.scene.isActive('GameOver'));const r=game.scene.getScene('GameOver'),s=r.status();check(s.meters===10&&s.boxes===11&&s.perfectBoxes===11,'结算统计不再49或50');const bank=g.wallet.total;press(r.retryButton);await until(()=>g.scene.isActive());hold(g);check(g.meters()===0&&g.checkpoints.status().nextMeters===50&&g.checkpoints.status().bursts===0&&g.wallet.total===bank,'重试清零且保留金币')});
 await test('开局预置仍在屏幕上方，领取后重开清理所有旧爆袋特效',async()=>{const g=await reset();const before=g.checkpoints.status();check(before.label===50&&before.visible&&before.screenY+96<0,'开局提前放置50');poseGate(g,g.player.node.x,g.top(g.player.node)-90);g.simulate(.008);const old=g.checkpoints;await reset();check(old.effects.size===0&&g.checkpoints.status().bursts===0,'重开清理旧特效')});
 report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.textures.exists('checkpoint-bag'),8000);if(out.textContent==='资源加载中')report('就绪：可演示新规则或运行回归');
</script></body></html>
