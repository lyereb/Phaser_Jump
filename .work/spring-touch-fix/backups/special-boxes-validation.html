<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>特殊盒子本地验证</title><style>body{margin:16px;background:#e8f5fb;color:#1a4059;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:440px}button{padding:10px;margin:4px;border:1px solid #6b98af;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>特殊道具盒子验证</h1><p>金币使用独立 QA 存储键，不修改正常游戏金币。</p><button id="coin">金币盒普通落地</button><button id="perfect">金币盒完美落地</button><button id="shield">获得护盾</button><button id="spring">弹簧十盒演示</button><button id="tests">运行道具场景测试</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';
const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-special');
const out=document.getElementById('result');const delay=ms=>new Promise(r=>setTimeout(r,ms));
const report=v=>out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
const check=(condition,message)=>{if(!condition)throw new Error(message)};
async function until(predicate,timeout=2500){const end=performance.now()+timeout;while(performance.now()<end){if(predicate())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景状态超时')}
async function reset(kind='normal',meters=0,streak=0){
 const g=game.scene.getScene('Game');if(g.scene.isActive())g.scene.restart();else game.scene.start('Game');await delay(100);
 g.forceItem(kind);g.placeBlock(g.mover,g.anchorX+1000,g.stackBottom(g.support));g.mover.vx=0;
 g.heightMeters=meters;g.perfectStreak=streak;g.updateHeight();g.prepareCheckpoint();await delay(320);return g;
}
function land(g,perfect=true){
 const old=g.stack.length;const block=g.mover;const targetX=g.anchorX+(perfect?0:22);
 g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;g.checkpoints.beginJump();
 let delivered=false;
 for(let i=0;i<150;i++){
  if(!delivered && g.bottom(g.player.node)<g.top(g.body(block))-2){g.placeBlock(block,targetX,g.stackBottom(g.support));block.vx=0;delivered=true}
  g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break;
 }
 g.syncPlayerSprite();check(g.stack.length===old+1,'应成功踩住新盒子');return block;
}
function holdMover(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
function status(g){return {coins:g.wallet.total,shield:g.shieldCharge.active,meters:g.meters(),spring:g.springFlight?{elapsed:g.springFlight.elapsed,boxes:g.springFlight.deliveries.length}:null,stack:g.stack.length,checkpoint:g.checkpoints.status()}}
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('coin').onclick=async()=>{const g=await reset('coin');land(g,false);holdMover(g);report(status(g))};
document.getElementById('perfect').onclick=async()=>{const g=await reset('coin');land(g,true);holdMover(g);report(status(g))};
document.getElementById('shield').onclick=async()=>{const g=await reset('shield');land(g,true);holdMover(g);report(status(g))};
document.getElementById('spring').onclick=async()=>{const g=await reset('spring');land(g,true);report('弹簧起跳：十个普通盒子从下方飞入');await until(()=>!g.springFlight);holdMover(g);report(status(g))};
document.getElementById('tests').onclick=async()=>{
 const results=[];const test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};
 try{
  await test('金币左上角、暂停右上角，调试按钮不遮挡',async()=>{
   const g=await reset();check(g.coinHud.root.x===16&&g.coinHud.root.y===16,'金币HUD应在左上');
   check(g.coinHud.root.scrollFactorX===0&&g.coinHud.root.scrollFactorY===0,'HUD不随镜头移动');
   check(Math.abs(g.pauseButton.button.x-(g.scale.width-60))<.01,'暂停应右上');
   check(g.debugPanel.buttonBg.y-g.debugPanel.buttonBg.height/2>g.pauseButton.button.y+44,'调试入口应在暂停下方');
  });
  await test('普通金币20与50端点，完美同次抽样翻倍为40与100',async()=>{
   for(const perfect of [false,true])for(const random of [0,.999999]){
    const g=await reset('coin');const before=g.wallet.total;const old=Math.random;Math.random=()=>random;
    let block;try{block=land(g,perfect)}finally{Math.random=old}
    holdMover(g);const expected=(random===0?20:50)*(perfect?2:1);
    check(g.wallet.total-before===expected,'金币应奖励'+expected);const balance=g.wallet.total;
    g.activateItem(block,perfect);check(g.wallet.total===balance,'同盒不能重复领奖');
   }
  });
  await test('金币HUD与钱包一致，重新开始保留累计金币',async()=>{
   const g=await reset('coin');land(g,true);holdMover(g);const coins=g.wallet.total;
   check(g.coinHud.label.text===String(coins),'HUD数量应一致');await reset();check(g.wallet.total===coins,'金币应累计保留');
  });
  await test('护盾气泡跟随，第一次撞击抵挡，第二次正常击飞',async()=>{
   const g=await reset('shield');land(g,true);holdMover(g);check(g.shieldCharge.active&&g.itemEffects.bubble.visible,'获得护盾应显示气泡');
   const first=g.mover;g.placeBlock(first,g.player.node.x,g.stackBottom(g.support));g.resolve();g.syncPlayerSprite();
   check(g.phase==='play'&&!g.shieldCharge.active,'一次护盾应抵挡并消耗');check(g.mover!==first&&!first.moving,'撞击盒需移除碰撞');
   const second=g.mover;g.placeBlock(second,g.player.node.x,g.stackBottom(g.support));second.vx=0;g.resolve();check(g.phase==='dead','第二次应正常击飞');
  });
  await test('重复获得护盾不叠加，重开清空护盾',async()=>{
   const g=await reset('shield');land(g);holdMover(g);g.shieldCharge.grant();check(g.shieldCharge.consume(),'应有一次护盾');check(!g.shieldCharge.consume(),'不能有第二层');
   g.shieldCharge.grant();await reset();check(!g.shieldCharge.active,'重开应无护盾');
  });
  await test('弹簧自动高跳，恰好10个普通盒居中叠放并落到顶层',async()=>{
   const g=await reset('spring');const source=land(g);const flight=g.springFlight;
   check(flight&&flight.deliveries.length===10,'必须自动开始且仅10盒');check(g.mover===null,'不能有普通随机进场干扰');
   check(flight.deliveries.every(d=>d.block.item==='normal'),'十盒全部普通');const beforeStack=g.stack.length;const beforeMeters=g.meters();let highest=0;
   await until(()=>{highest=Math.max(highest,flight.launchSurface-g.bottom(g.player.node));return !g.springFlight});holdMover(g);
   check(highest>860&&highest<905,'应跳约10个视觉盒高');check(g.stack.length===beforeStack+10,'只能增加10盒');
   check(g.springFlightsCompleted===1&&g.grounded,'必须自动落地一次');check(g.support===flight.deliveries[9].block,'踩到第10盒');
   for(let i=0;i<10;i++){
    const b=g.body(flight.deliveries[i].block);check(Math.abs(b.x-flight.columnX)<1e-8,'所有盒中心必须重合');
    check(Math.abs(g.top(b)-(flight.launchSurface-(i+1)*74.24))<1e-7,'每层高度需精确');
   }
   check(Math.abs(g.bottom(g.player.node)-flight.landingSurface)<1e-7,'玩家脚底吸附顶面');
   check(g.meters()>beforeMeters,'自动完美叠盒应结算原有完美积分');
   const count=g.stack.length;g.activateItem(source,true);check(g.stack.length===count&&!g.springFlight,'弹簧盒不能重复触发');
  });
  await test('弹簧期间0.8秒前十盒就位，普通生成与额外操作不介入',async()=>{
   const g=await reset('spring');land(g);const f=g.springFlight;await until(()=>f.elapsed>=.82);
   check(f.deliveries.every(d=>Math.abs(d.block.node.x-d.targetX)<1e-8&&Math.abs(d.block.node.y-d.targetY)<1e-8),'十盒应在下降前完全就位');
   g.spawnMover();g.forceItem('coin');check(g.mover===null&&g.springFlight===f,'不得中途生成随机盒');
   await until(()=>!g.springFlight);holdMover(g);
  });
  await test('弹簧跨过50和100米checkpoint，不漏触发、不重复',async()=>{
   const g=await reset('spring',49,3);land(g);await until(()=>!g.springFlight);holdMover(g);
   check(g.meters()===104,'原有完美积分应到104');check(g.checkpoints.status().bursts===2,'50和100应恰好各爆一次');check(g.checkpoints.status().nextMeters===150,'下个应150');
  });
  await test('暂停及恢复倒计时冻结弹簧和十盒，恢复不重复生成',async()=>{
   const g=await reset('spring');land(g);await delay(200);g.pauseButton.toggle();const f=g.springFlight;
   const elapsed=f.elapsed;const positions=f.deliveries.map(d=>[d.block.node.x,d.block.node.y]);await delay(180);
   check(f.elapsed===elapsed,'暂停不得推进物理时钟');check(JSON.stringify(positions)===JSON.stringify(f.deliveries.map(d=>[d.block.node.x,d.block.node.y])),'暂停不得移动盒子');
   g.pauseButton.toggle();await delay(180);check(f.elapsed===elapsed,'恢复倒计时不得推进弹簧');g.clearResumeCountdown();g.unfreezePlay();await until(()=>!g.springFlight);holdMover(g);
   check(g.stack.length===12&&g.springFlightsCompleted===1,'恢复应仍只叠10盒并落地一次');
  });
  await test('弹簧中途重开清理十盒和旧特效，不继承护盾或飞行',async()=>{
   const g=await reset('spring');land(g);await delay(120);const f=g.springFlight;const effects=g.itemEffects;await reset();
   check(!g.springFlight&&!g.shieldCharge.active&&g.stack.length===1,'新局应回到正常起点');check(f.deliveries.every(d=>!d.block.node.scene),'旧十盒需清理');check(effects.effects.size===0,'旧特效需清理');
  });
  report({passed:results.length,results});
 }catch(error){report({failed:String(error),results})}
};
await delay(1600);report('就绪：可单独预览道具或运行场景测试');
</script></body></html>
