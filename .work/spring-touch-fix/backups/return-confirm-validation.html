<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>返回确认窗口验证</title><style>body{margin:16px;background:#f4edf2;color:#673642;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:450px}button{padding:10px;margin:4px;border:1px solid #b27b95;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>返回确认窗口验证</h1><p>使用独立 QA 金币存储，不影响正常游戏金币。</p><button id="show">显示返回确认窗口</button><button id="spring">弹簧途中打开窗口</button><button id="tests">运行窗口回归测试</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';
const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-return');
const KEY='ReturnConfirmation';const out=document.getElementById('result');const delay=ms=>new Promise(r=>setTimeout(r,ms));
const report=value=>out.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);
const check=(value,message)=>{if(!value)throw new Error(message)};
async function until(predicate,timeout=3500){const end=performance.now()+timeout;while(performance.now()<end){if(predicate())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景状态超时')}
function holdMover(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
async function reset(kind='normal',meters=0,streak=0){
 game.scene.stop('MainMenu');game.scene.stop('GameOver');const g=game.scene.getScene('Game');g.scene.restart();await delay(100);await until(()=>g.scene.isActive()&&!g.returnConfirmationOpen);
 g.forceItem(kind);holdMover(g);g.heightMeters=meters;g.perfectStreak=streak;g.updateHeight();g.prepareCheckpoint();await delay(280);return g;
}
async function open(g){g.returnButton.button.emit('pointerup');await until(()=>g.scene.isPaused()&&game.scene.isActive(KEY));return game.scene.getScene(KEY)}
function press(node){const p={id:1,button:0};const event={stopPropagation(){}};node.emit('pointerdown',p,0,0,event);node.emit('pointerup',p,0,0,event)}
async function cancel(g,method='button'){const m=game.scene.getScene(KEY);if(method==='escape')m.input.keyboard.emit('keydown-ESC');else press(method==='close'?m.closeButton:m.continueButton);await until(()=>g.scene.isActive()&&!game.scene.isActive(KEY));}
function state(g){return JSON.stringify({phase:g.phase,grounded:g.grounded,meters:g.meters(),coins:g.wallet.total,shield:g.shieldCharge.active,player:[g.player.node.x,g.player.node.y,g.player.vx,g.player.vy],camera:[g.cameras.main.scrollX,g.cameras.main.scrollY],spring:g.springFlight?.elapsed,objects:g.children.list.map(o=>[o.x,o.y,o.scaleX,o.scaleY,o.alpha,o.angle,o.visible,o.anims?.currentFrame?.index])})}
function land(g){
 const old=g.stack.length;const block=g.mover;g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;g.checkpoints.beginJump();let delivered=false;
 for(let i=0;i<150;i++){if(!delivered&&g.bottom(g.player.node)<g.top(g.body(block))-2){g.placeBlock(block,g.anchorX,g.stackBottom(g.support));block.vx=0;delivered=true}g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break}g.syncPlayerSprite();check(g.stack.length===old+1,'应踩住弹簧新盒子');
}
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('show').onclick=async()=>{const g=await reset();await open(g);report({paused:g.scene.isPaused(),dialog:game.scene.getScene(KEY).status()})};
document.getElementById('spring').onclick=async()=>{const g=await reset('spring');land(g);await delay(180);await open(g);report({paused:g.scene.isPaused(),elapsed:g.springFlight.elapsed,boxes:g.springFlight.deliveries.length})};
document.getElementById('tests').onclick=async()=>{
 const results=[];const test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};
 try{
  await test('右上点击先确认，不退出菜单；打开窗口暂停整局',async()=>{const g=await reset();g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive(KEY));check(g.scene.isPaused(),'Game应暂停');check(!game.scene.isActive('MainMenu'),'不能提前退出');check(game.scene.getScene(KEY).status().meters===0,'当前高度应一致')});
  await test('角色、镜头、盒子、护盾气泡和checkpoint所有特效冻结',async()=>{const g=await reset();g.shieldCharge.grant();g.itemEffects.shieldGranted(g.player.node.x,g.player.node.y);g.checkpoints.preview(g.anchorX,g.cameras.main.scrollY+220);g.player.vy=-240;g.grounded=false;await delay(50);await open(g);const before=state(g);await delay(430);check(state(g)===before,'暂停不应推进世界或动画')});
  await test('游戏计时器冻结，恢复后只触发一次且不补算停留时间',async()=>{const g=await reset();let fired=0;g.time.delayedCall(160,()=>fired++);await open(g);await delay(270);check(fired===0,'暂停不触发定时事件');await cancel(g);await delay(220);check(fired===1,'恢复后执行一次')});
  await test('继续游戏恢复原局，按钮点击不意外起跳，可反复开关',async()=>{const g=await reset();const oldStack=g.stack.length;for(let i=0;i<3;i++){await open(g);const before=g.wallet.total;await cancel(g);check(g.grounded&&g.stack.length===oldStack&&g.wallet.total===before,'取消不跳跃、不改金币和堆叠')} });
  await test('遮罩不关闭，未按下直接释放与重复点击不会执行按钮',async()=>{const g=await reset();const m=await open(g);const e={stopPropagation(){}};m.shade.emit('pointerdown',{id:1,button:0},0,0,e);m.shade.emit('pointerup',{id:1,button:0},0,0,e);m.returnButton.emit('pointerup',{id:1,button:0},0,0,e);check(g.scene.isPaused()&&m.scene.isActive(),'释放事件或遮罩不能退出');g.returnButton.button.emit('pointerup');check(g.returnConfirmationOpen,'重复打开不得切换状态');await cancel(g)});
  await test('恢复Tween不跳过弹窗停留时长',async()=>{const g=await reset();const target=g.add.rectangle(10,10,1,1);g.tweens.add({targets:target,x:1010,duration:2000});await delay(40);await open(g);const x=target.x;await delay(360);check(target.x===x,'Tween应冻结');await cancel(g);await delay(40);check(target.x-x<85,'恢复后不能补算360毫秒');target.destroy()});
  await test('弹簧十盒冻结并续接同一飞行，50/100米checkpoint仍恰好两次',async()=>{const g=await reset('spring',49,3);land(g);await delay(120);await open(g);const f=g.springFlight;const before=state(g);await delay(280);check(g.springFlight===f&&state(g)===before,'弹簧和十盒必须冻结');await cancel(g);await until(()=>!g.springFlight);holdMover(g);check(g.stack.length===12&&g.springFlightsCompleted===1,'只增加同一批十盒');check(g.meters()===104&&g.checkpoints.status().bursts===2,'两处checkpoint不重复且不遗漏')});
  await test('关闭按钮和Escape都恢复，结算后不残留确认窗口',async()=>{const g=await reset();await open(g);await cancel(g,'close');await open(g);await cancel(g,'escape');g.phase='over';g.showOver();await until(()=>game.scene.isActive('GameOver'));check(!game.scene.isActive(KEY),'结算时无暂停弹窗');press(game.scene.getScene('GameOver').menuButton);await until(()=>game.scene.isActive('MainMenu'))});
  await test('确认返回菜单清理旧局，再次开始金币保留且没有暂停残留',async()=>{const g=await reset('spring');const coins=g.wallet.add(37);g.coinHud.setValue(coins);land(g);const flight=g.springFlight;const effects=g.itemEffects;const m=await open(g);press(m.returnButton);await until(()=>game.scene.isActive('MainMenu')&&!game.scene.isActive(KEY));check(!g.scene.isActive()&&!g.scene.isPaused(),'旧Game应停止');check(flight.deliveries.every(d=>!d.block.node.scene),'十盒应销毁');check(effects.effects.size===0,'特效应清理');check(!g.sound.get('bgm')?.isPlaying,'返回后音乐应停止');const fresh=await reset();check(fresh.wallet.total===coins&&fresh.stack.length===1&&!fresh.returnConfirmationOpen,'新局保留金币、清除弹窗状态')});
  await test('弹窗期间外部重开清理旧弹窗，不遗留输入或暂停状态',async()=>{const g=await reset();await open(g);g.scene.restart();await until(()=>g.scene.isActive()&&!game.scene.isActive(KEY));check(!g.returnConfirmationOpen&&g.stack.length===1,'重开干净');holdMover(g);await open(g);await cancel(g)});
  await test('窄屏与横屏弹窗完整居中、两种按钮都在卡片内',async()=>{const g=await reset();await open(g);const box=document.getElementById('game-container');for(const size of [[320,480],[700,380]]){box.style.width=size[0]+'px';box.style.height=size[1]+'px';game.scale.refresh();await delay(100);const m=game.scene.getScene(KEY);const s=m.status();check(s.x-s.width/2>=0&&s.y-s.height/2>=0&&s.x+s.width/2<=m.scale.width&&s.y+s.height/2<=m.scale.height,'卡片需完整可见');check(s.continueBounds.bottom<s.y+s.height/2&&s.returnBounds.bottom<s.y+s.height/2,'按钮不能越界')}box.style.width='360px';box.style.height='640px';game.scale.refresh();await delay(100);await cancel(g)});
  report({passed:results.length,results});
 }catch(error){report({failed:String(error),results})}
};
await until(()=>game.textures.exists('checkpoint-bag'),8000);if(out.textContent==='资源加载中')report('就绪：可查看弹窗或运行回归测试');
</script></body></html>
