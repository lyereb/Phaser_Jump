<!doctype html><html><head><base href="/"><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Canvas street QA</title></head><body><div id="app"><div id="game-container"></div></div><script type="module">import {Game,CANVAS,Scale,Scene} from 'phaser';import {MenuStreetBackground,loadMenuStreetAssets} from '/src/game/menuStreet.ts';class Demo extends Scene{constructor(){super('Demo')}preload(){this.load.setPath('assets');loadMenuStreetAssets(this)}create(){this.background=new MenuStreetBackground(this);this.scale.on('resize',()=>this.background.resize(this.scale.width,this.scale.height));this.events.once('shutdown',()=>this.background.destroy())}update(t,d){this.background.update(d)}}window.__game=new Game({type:CANVAS,parent:'game-container',width:720,height:1280,scale:{mode:Scale.EXPAND,autoCenter:Scale.CENTER_BOTH},scene:[Demo]});</script></body></html>
