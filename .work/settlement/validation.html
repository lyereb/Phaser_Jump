<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><title>挑战结算验证</title><style>body{margin:16px;background:#f4edf2;color:#673642;font:15px Arial}main{display:flex;gap:20px}#game-container{width:360px;height:640px;flex:none}aside{width:450px}button{padding:10px;margin:4px;border:1px solid #b27b95;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5;background:white;padding:12px}h1{font-size:22px}</style></head><body><main><div id="game-container"></div><aside><h1>挑战结算真实场景验证</h1><p>独立 QA 金币键，不影响正常游戏金币。</p><button id="show">查看真实结算页面</button><button id="zero">查看零分结算</button><button id="large">查看大数字排版</button><button id="tests">运行结算回归测试</button><pre id="result">资源加载中</pre></aside></main><script type="module">
import StartGame from '/src/game/main.ts';const game=StartGame('game-container');game.registry.set('coinStorageKey','phaser-jump-coins-qa-settlement');
const out=document.getElementById('result');const delay=ms=>new Promise(r=>setTimeout(r,ms));const report=value=>out.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);const check=(value,message)=>{if(!value)throw new Error(message)};
async function until(predicate,timeout=4500){const end=performance.now()+timeout;while(performance.now()<end){if(predicate())return;await new Promise(requestAnimationFrame)}throw new Error('等待场景超时')}
function hold(g){if(g.mover){g.placeBlock(g.mover,g.anchorX+1200,g.stackBottom(g.support));g.mover.vx=0}}
async function reset(kind='normal'){game.scene.stop('MainMenu');game.scene.stop('GameOver');game.scene.stop('ReturnConfirmation');const g=game.scene.getScene('Game');g.scene.restart();await delay(100);await until(()=>g.scene.isActive()&&!g.settlementShown);g.forceItem(kind);hold(g);await delay(120);return g}
function press(node){const p={id:1,button:0},e={stopPropagation(){}};node.emit('pointerdown',p,0,0,e);node.emit('pointerup',p,0,0,e)}
function land(g,perfect=true){const old=g.stack.length,block=g.mover;g.forcedItem='normal';g.grounded=false;g.player.vy=-2*g.risePx;g.player.node.y-=2;let delivered=false;for(let i=0;i<150;i++){if(!delivered&&g.bottom(g.player.node)<g.top(g.body(block))-2){g.placeBlock(block,g.anchorX+(perfect?0:31),g.stackBottom(g.support));block.vx=0;delivered=true}g.simulate(.008);if(g.stack.length>old||g.phase!=='play')break}g.syncPlayerSprite();check(g.stack.length===old+1,'真实落地未成功');hold(g)}
async function fail(g){g.fly(0);g.player.node.y=g.cameras.main.scrollY+g.scale.height+220;await until(()=>game.scene.isActive('GameOver'));return game.scene.getScene('GameOver')}
async function show(){const g=await reset('coin');land(g);g.forceItem('normal');hold(g);land(g);g.forceItem('normal');hold(g);land(g,false);const result=await fail(g);report({actualResult:result.status(),gameStopped:!g.scene.isActive()})}
window.addEventListener('error',e=>report('ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>report('ERROR: '+e.reason));
document.getElementById('show').onclick=show;
document.getElementById('zero').onclick=async()=>{const g=await reset();const result=await fail(g);report({actualResult:result.status()})};
document.getElementById('large').onclick=async()=>{game.scene.stop('Game');game.scene.stop('MainMenu');game.scene.start('GameOver',{meters:999999999,coinsEarned:999999999,totalCoins:9007199254740991,boxes:99999999,perfectBoxes:9999999});await until(()=>game.scene.isActive('GameOver'));report(game.scene.getScene('GameOver').status())};
document.getElementById('tests').onclick=async()=>{const results=[];const test=async(name,fn)=>{await fn();results.push({name,passed:true});report({running:true,results})};try{
 await test('失败落出屏幕后进入独立结算，旧文字不再生成且旧局停止',async()=>{const g=await reset();const nodes=g.stack.map(b=>b.node);const effects=g.itemEffects;const r=await fail(g);check(!g.scene.isActive()&&!g.scene.isPaused(),'Game必须停止');check(nodes.every(n=>!n.scene)&&effects.effects.size===0,'旧局节点和特效必须清理');check(!r.children.list.some(o=>o.text?.includes('掉下来啦')||o.text?.includes('点一下再冲')),'旧失败文字不能出现');check(!g.sound.get('bgm')?.isPlaying,'结算停止游戏音乐')});
 await test('零米、零新金币和零盒子结算正确，不把地面计入',async()=>{const g=await reset();const bank=g.wallet.total;const r=await fail(g);const s=r.status();check(s.meters===0&&s.boxes===0&&s.perfectBoxes===0&&s.coinsEarned===0&&s.totalCoins===bank,'零局统计正确')});
 await test('完美金币盒收益为40至100，结算与本局钱包差额完全一致',async()=>{const g=await reset('coin');const before=g.wallet.total;land(g,true);const earned=g.wallet.total-before;const r=await fail(g);const s=r.status();check(earned>=40&&earned<=100&&earned%2===0,'完美翻倍收益范围');check(s.coinsEarned===earned&&s.totalCoins===before+earned,'结算金币不能错算');check(s.meters===2&&s.boxes===1&&s.perfectBoxes===1,'第一次完美踩住统计')});
 await test('普通金币盒收益20至50，普通叠放不算完美',async()=>{const g=await reset('coin');const before=g.wallet.total;land(g,false);const earned=g.wallet.total-before;const r=await fail(g);const s=r.status();check(earned>=20&&earned<=50,'普通金币收益范围');check(s.coinsEarned===earned&&s.meters===1&&s.boxes===1&&s.perfectBoxes===0,'普通落地统计')});
 await test('金币只计这一局；重试重置成绩护盾checkpoint并保留余额',async()=>{const g=await reset();g.wallet.add(55);g.shieldCharge.grant();const r=await fail(g);const total=r.status().totalCoins;press(r.retryButton);await until(()=>g.scene.isActive()&&!r.scene.isActive());hold(g);check(g.wallet.total===total&&g.roundStartCoins===total,'新局从已有余额开始');check(g.meters()===0&&g.stack.length===1&&g.perfectBoxes===0&&!g.shieldCharge.active&&!g.springFlight&&!g.returnConfirmationOpen,'本局和道具状态清零');check(g.grounded,'重试单击不能穿透起跳');check(g.checkpoints.status().nextMeters===50,'checkpoint重新从50米开始');const next=await fail(g);check(next.status().coinsEarned===0,'旧55枚不得重复显示为新奖励')});
 await test('连续完美加普通落地后，米数盒数与完美总数保持真实统计',async()=>{const g=await reset();land(g,true);g.forceItem('normal');hold(g);land(g,true);g.forceItem('normal');hold(g);land(g,false);const r=await fail(g);const s=r.status();check(s.meters===6&&s.boxes===3&&s.perfectBoxes===2,'2+3+1米，3盒2完美')});
 await test('弹簧自动十盒计入堆叠与完美，不造成漏算或重复结算',async()=>{const g=await reset('spring');land(g);await until(()=>!g.springFlight);hold(g);const old=g.stack.map(b=>b.node);const r=await fail(g);const s=r.status();check(s.meters===10&&s.boxes===11&&s.perfectBoxes===11,'整次弹簧动作10米，仍叠十一盒');check(old.every(n=>!n.scene),'结算销毁全部十一盒');const bank=g.wallet.total;g.showOver();g.showOver();await delay(80);check(r.status().totalCoins===bank&&g.wallet.total===bank,'重复结束不能额外奖励')});
 await test('未按下直接释放、右键和背景点击都不能重开',async()=>{const g=await reset();const r=await fail(g);const e={stopPropagation(){}};r.shade.emit('pointerdown',{id:1,button:0},0,0,e);r.shade.emit('pointerup',{id:1,button:0},0,0,e);r.retryButton.emit('pointerup',{id:1,button:0},0,0,e);r.retryButton.emit('pointerdown',{id:2,button:2},0,0,e);r.retryButton.emit('pointerup',{id:2,button:2},0,0,e);await delay(70);check(r.scene.isActive()&&!g.scene.isActive(),'不能误重开')});
 await test('结算返回主菜单只有一次选择，后续再次开始干净且金币保留',async()=>{const g=await reset();g.wallet.add(23);const r=await fail(g);const bank=g.wallet.total;press(r.menuButton);press(r.menuButton);press(r.retryButton);await until(()=>game.scene.isActive('MainMenu'));check(!r.scene.isActive()&&!g.scene.isActive(),'只返回菜单');game.scene.getScene('MainMenu').scene.start('Game');await until(()=>g.scene.isActive());hold(g);check(g.wallet.total===bank&&g.meters()===0&&!g.settlementShown,'再次开始数据正确')});
 await test('游戏返回确认正常恢复，失败结算不残留确认场景',async()=>{const g=await reset();g.returnButton.button.emit('pointerup');await until(()=>game.scene.isActive('ReturnConfirmation'));check(g.scene.isPaused(),'返回确认仍暂停');press(game.scene.getScene('ReturnConfirmation').continueButton);await until(()=>g.scene.isActive());hold(g);const r=await fail(g);check(!game.scene.isActive('ReturnConfirmation')&&r.scene.isActive(),'结束后没有确认弹窗')});
 await test('竖屏横屏与大数值布局完整，两个选择按钮均在页面内',async()=>{const g=await reset();const r=await fail(g);r.scene.restart({meters:999999999,coinsEarned:999999999,totalCoins:9007199254740991,boxes:99999999,perfectBoxes:9999999});await delay(100);const box=document.getElementById('game-container');for(const size of [[320,480],[700,380]]){box.style.width=size[0]+'px';box.style.height=size[1]+'px';game.scale.refresh();await delay(120);const s=r.status();check(s.x-s.width/2>=0&&s.y-s.height/2>=0&&s.x+s.width/2<=r.scale.width&&s.y+s.height/2<=r.scale.height,'结算卡片完整居中');check(s.retryBounds.bottom<s.y+s.height/2&&s.menuBounds.bottom<s.y+s.height/2,'按钮不能越界')}box.style.width='360px';box.style.height='640px';game.scale.refresh();await delay(120)});
 report({passed:results.length,results});
}catch(error){report({failed:String(error),results})}};
await until(()=>game.textures.exists('checkpoint-bag'),8000);if(out.textContent==='资源加载中')report('就绪：可查看真实结算或运行测试');
</script></body></html>
